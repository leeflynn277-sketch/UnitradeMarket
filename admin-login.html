<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In — Campus Market</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-brand">
        <div class="mark" style="background: var(--orange);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 4v5c0 4.2-2.8 8-7 9-4.2-1-7-4.8-7-9V7l7-4z"/></svg>
        </div>
        <h1>Admin Portal</h1>
        <p>Secure access for Campus Market administrators</p>
    </div>

    <div class="auth-card">
        <h2>Admin Sign In</h2>
        <form id="adminLoginForm">
            <div class="field">
                <label for="identifier">Admin Email or Student ID</label>
                <input type="text" id="identifier" placeholder="admin@campus.com" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-orange btn-block">Access Dashboard</button>
        </form>
        <p class="auth-foot"><a href="login.html">Back to student sign in</a></p>
    </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script>
const form = document.getElementById('adminLoginForm');
form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const identifier = document.getElementById('identifier').value.trim();
    const password = document.getElementById('password').value;

    if (!identifier || !password) {
        cmToast('Please enter your admin credentials.');
        return;
    }

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Checking access…';

    try {
        const { token, user } = await Api.login({ identifier, password });
        if (!user.isAdmin) {
            Api.clearSession();
            cmToast('This portal is for administrators only.');
            btn.disabled = false;
            btn.textContent = 'Access Dashboard';
            return;
        }

        Api.setSession(token, user);
        cmToast('Admin access granted');
        setTimeout(() => {
            const returnTo = cmParam('returnTo') || 'admin.html';
            window.location.href = returnTo;
        }, 350);
    } catch (err) {
        cmHandleApiError(err, 'Admin sign in failed.');
        btn.disabled = false;
        btn.textContent = 'Access Dashboard';
    }
});
</script>
</body>
</html>
