<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Campus Market</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="messages-view">
<div class="shell-page">
<div class="shell">
    <header class="shell-topbar">
        <button class="icon-btn" onclick="cmGoBack('index.html')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1>Messages</h1>
        <span style="width:2.25rem;"></span>
    </header>

    <div class="shell-body">
        <div class="msg-shell" id="msgShell">
            <div class="msg-pane-list" id="msgPaneList">
                <div style="padding:1rem 1rem .2rem;">
                    <h2 style="margin:0 0 .8rem; font-size:1.15rem; font-weight:800;">My messages</h2>
                    <div class="search-row" style="margin-bottom:.7rem;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                        <input type="search" id="convSearch" placeholder="Search">
                    </div>
                    <div class="dash-tabs" style="margin-bottom:0;">
                        <button type="button" class="dash-tab is-active" data-filter="all">All</button>
                        <button type="button" class="dash-tab" data-filter="unread">Unread</button>
                    </div>
                </div>
                <div id="convListWrap" style="flex:1; min-height:0; overflow-y:auto;"></div>
            </div>

            <div class="msg-pane-thread" id="msgPaneThread">
                <div class="msg-empty-thread-hint" id="threadEmptyHint">
                    Select a conversation to start chatting.
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
let pollTimer = null;
let allConversations = [];
let activeFilter = 'all';
let activeConversationId = null;

function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
}

function conversationThumb(c) {
    if (c.product && c.product.image) {
        return `<div class="thumb"><img src="${Api.resolveAssetUrl(c.product.image)}" alt=""></div>`;
    }
    return `<div class="avatar">${cmInitials(c.otherUser.name)}</div>`;
}

function renderConvList() {
    const wrap = document.getElementById('convListWrap');
    const q = (document.getElementById('convSearch').value || '').trim().toLowerCase();

    let items = allConversations;
    if (activeFilter === 'unread') items = items.filter((c) => c.unreadCount > 0);
    if (q) {
        items = items.filter((c) =>
            c.otherUser.name.toLowerCase().includes(q) ||
            (c.product && c.product.title && c.product.title.toLowerCase().includes(q)) ||
            (c.lastMessage || '').toLowerCase().includes(q)
        );
    }

    if (!items.length) {
        wrap.innerHTML = `
            <div class="empty-state">
                <p>${allConversations.length ? 'No conversations match.' : 'No conversations yet.<br>Message a seller from their listing to start one.'}</p>
            </div>`;
        return;
    }

    wrap.innerHTML = items.map((c) => {
        const isClosed = c.product && c.product.status && c.product.status !== 'active';
        return `
        <a href="messages.html?id=${c.id}" class="msg-conv-row ${Number(c.id) === Number(activeConversationId) ? 'is-active' : ''}" data-conv-id="${c.id}">
            ${conversationThumb(c)}
            <div class="info">
                <div class="top-line">
                    <strong>${c.otherUser.name}</strong>
                    <span class="when">${c.lastMessageAt}</span>
                </div>
                ${c.product ? `
                <div class="prod-line">
                    ${isClosed ? '<span class="mini-status">Closed</span>' : ''}
                    <span class="prod-title">${c.product.title}</span>
                </div>` : ''}
                <span class="preview">${c.lastMessage}</span>
            </div>
            ${c.unreadCount > 0 ? `<span class="unread-dot">${c.unreadCount}</span>` : ''}
        </a>
        `;
    }).join('');

    wrap.querySelectorAll('.msg-conv-row').forEach((row) => {
        row.addEventListener('click', (e) => {
            e.preventDefault();
            const id = row.getAttribute('data-conv-id');
            window.history.pushState(null, '', `messages.html?id=${id}`);
            openThread(id);
        });
    });
}

async function loadConversations() {
    try {
        const data = await Api.listConversations();
        allConversations = data.conversations;
    } catch (err) {
        cmHandleApiError(err, 'Could not load your messages.');
        allConversations = [];
    }
    renderConvList();
}

document.querySelectorAll('.dash-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
        activeFilter = btn.dataset.filter;
        document.querySelectorAll('.dash-tab').forEach((b) => b.classList.toggle('is-active', b === btn));
        renderConvList();
    });
});
document.getElementById('convSearch').addEventListener('input', renderConvList);

function scrollThreadToBottom() {
    const el = document.querySelector('.msg-thread-messages');
    if (el) el.scrollTop = el.scrollHeight;
}

function dayKey(iso) {
    const d = new Date((iso || '').replace(' ', 'T') + 'Z');
    return d.toDateString();
}
function dayLabel(iso) {
    const d = new Date((iso || '').replace(' ', 'T') + 'Z');
    return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
}
function clockLabel(iso) {
    const d = new Date((iso || '').replace(' ', 'T') + 'Z');
    return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function renderBubbles(messages, otherName) {
    if (!messages.length) {
        return `<p style="text-align:center;color:var(--muted);font-size:.8rem;">Say hello to ${otherName}</p>`;
    }
    let html = '';
    let lastDay = null;
    messages.forEach((m) => {
        const key = dayKey(m.createdAt);
        if (key !== lastDay) {
            html += `<div class="msg-date-divider">${dayLabel(m.createdAt)}</div>`;
            lastDay = key;
        }
        html += `
            <div class="msg-bubble-wrap ${m.mine ? 'mine' : 'theirs'}">
                <div class="msg-bubble">${m.body}</div>
                <div class="msg-bubble-time">${clockLabel(m.createdAt)}</div>
            </div>`;
    });
    return html;
}

async function refreshThreadMessages(conversationId, otherName) {
    try {
        const { messages } = await Api.getConversation(conversationId);
        const wrap = document.querySelector('.msg-thread-messages');
        if (!wrap) return;
        wrap.innerHTML = renderBubbles(messages, otherName);
        scrollThreadToBottom();
    } catch (err) {
        // silent on poll failures
    }
}

function threadHeader(conversation) {
    const p = conversation.product;
    return `
        <div class="msg-conv-row" style="border-bottom:1px solid var(--border); padding:.7rem 1.1rem; cursor:default;">
            <button type="button" class="msg-back-btn icon-btn" id="threadBackBtn" style="display:none; margin-right:-.3rem;" aria-label="Back to messages">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="avatar">${cmInitials(conversation.otherUser.name)}</div>
            <div class="info"><strong>${conversation.otherUser.name}</strong></div>
        </div>
        ${p ? `
        <a href="product.html?id=${p.id}" class="thread-product-bar" style="text-decoration:none;">
            <div class="thumb"><img src="${Api.resolveAssetUrl(p.image)}" alt=""></div>
            <div class="info">
                <a href="product.html?id=${p.id}">${p.title}</a>
                <span class="price">${cmFormatPrice(p.price)}</span>
            </div>
            ${p.status !== 'active' ? '<span class="mini-status">Closed</span>' : ''}
        </a>` : ''}
    `;
}

async function openThread(conversationId) {
    stopPolling();
    activeConversationId = conversationId;
    document.getElementById('msgShell').classList.add('thread-open');
    renderConvList();

    const pane = document.getElementById('msgPaneThread');
    pane.classList.add('is-shown');
    pane.innerHTML = `<div class="msg-empty-thread-hint">Loading…</div>`;

    let data;
    try {
        data = await Api.getConversation(conversationId);
    } catch (err) {
        pane.innerHTML = `<div class="msg-empty-thread-hint">Conversation not found.<br><a href="messages.html">&larr; Back to messages</a></div>`;
        return;
    }

    const conversation = data.conversation;
    pane.innerHTML = `
        ${threadHeader(conversation)}
        <div class="msg-thread-messages" style="flex:1; overflow-y:auto;">
            ${renderBubbles(data.messages, conversation.otherUser.name)}
        </div>
        <form id="threadForm" class="msg-compose-bar">
            <button type="button" class="msg-icon-btn" title="Emoji (coming soon)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
            </button>
            <button type="button" class="msg-icon-btn" title="Attach (coming soon)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5l-8.5 8.5a4 4 0 01-5.7-5.7l9-9a2.7 2.7 0 013.8 3.8l-8.9 8.9a1.3 1.3 0 01-1.9-1.9l8-8"/></svg>
            </button>
            <input type="text" id="threadInput" placeholder="Type a message" autocomplete="on" autocapitalize="sentences" spellcheck="true" inputmode="text" enterkeyhint="send">
            <button type="button" class="msg-icon-btn" title="Voice message (coming soon)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0M12 19v3"/></svg>
            </button>
            <button type="submit" class="msg-icon-btn send" aria-label="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
        </form>
    `;
    scrollThreadToBottom();

    const backBtn = document.getElementById('threadBackBtn');
    if (backBtn) backBtn.addEventListener('click', () => {
        document.getElementById('msgShell').classList.remove('thread-open');
        pane.classList.remove('is-shown');
        activeConversationId = null;
        window.history.pushState(null, '', 'messages.html');
        renderConvList();
    });

    const input = document.getElementById('threadInput');
    if (input) {
        setTimeout(() => input.focus(), 120);
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                document.getElementById('threadForm').requestSubmit();
            }
        });
    }

    document.getElementById('threadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('threadInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        input.focus();
        try {
            await Api.sendMessage(conversationId, text);
            await refreshThreadMessages(conversationId, conversation.otherUser.name);
            loadConversations();
        } catch (err) {
            cmHandleApiError(err, 'Could not send message.');
        }
    });

    pollTimer = setInterval(() => refreshThreadMessages(conversationId, conversation.otherUser.name), 4000);
}

async function init() {
    if (!cmRequireLogin()) return;

    await loadConversations();

    const conversationId = cmParam('id');
    const withId = cmParam('withId') || cmParam('start');
    const productId = cmParam('productId') || cmParam('product');
    const prefillText = cmParam('text');

    if (conversationId) {
        openThread(conversationId);
    } else if (withId) {
        try {
            const { conversationId: newId } = await Api.startConversation({
                otherUserId: Number(withId),
                productId: productId ? Number(productId) : undefined,
            });
            window.history.replaceState(null, '', `messages.html?id=${newId}`);
            loadConversations();
            await openThread(newId);
            if (prefillText) {
                const input = document.getElementById('threadInput');
                if (input) input.value = prefillText;
            }
        } catch (err) {
            cmHandleApiError(err, 'Could not start a conversation.');
        }
    }
}

window.addEventListener('beforeunload', stopPolling);
init();
</script>
</body>
</html>
