<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Meetup Zones — Campus Market</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="shell-page">
<div class="shell">
    <header class="shell-topbar">
        <button class="icon-btn" onclick="cmGoBack('checkout.html')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1>Safe Meetup Zones<span class="topbar-sub">Choose a verified location</span></h1>
        <span style="width:2.25rem;"></span>
    </header>

    <div class="shell-body">
        <div class="map-art">
            <span class="pin-dot" style="top:18px;left:28px;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
            <span class="pin-dot" style="top:42px;right:36px;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
            <span class="pin-dot" style="bottom:18px;left:96px;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
            <span class="pin-dot" style="bottom:30px;right:90px;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
            <span class="safe-flag">Safe Zone</span>
        </div>

        <div class="section-label" style="margin-top:0;">Available Safe Zones</div>
        <div id="zoneList"></div>

        <button type="button" class="btn btn-green btn-block" id="confirmBtn" style="margin-top:.4rem;" disabled>Confirm Location</button>

        <div class="tips-card">
            <div class="heading" style="display:flex;align-items:center;gap:.4rem;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 5-3.4 8.4-7 9-3.6-.6-7-4-7-9V6l7-3z"/></svg>Safety Tips</div>
            <ul>
                <li>Always meet in well-lit, public areas</li>
                <li>Bring a friend when collecting items</li>
                <li>Verify items before completing transaction</li>
                <li>Report suspicious activity to campus security</li>
            </ul>
        </div>
    </div>
</div>
</div>

<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
let selected = localStorage.getItem('cm_selected_zone') || 'uenr-library';

function renderZones() {
    const list = document.getElementById('zoneList');
    list.innerHTML = CM_SAFE_ZONES.map((z) => `
        <div class="zone-row ${z.id === selected ? 'is-selected' : ''}" data-zone="${z.id}">
            <span class="zicon"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
            <div class="info">
                <strong>${z.name}</strong>
                <span>${z.sub}</span>
                <span>${z.hours}</span>
            </div>
        </div>
    `).join('');

    list.querySelectorAll('.zone-row').forEach((row) => {
        row.addEventListener('click', () => {
            selected = row.dataset.zone;
            renderZones();
        });
    });

    document.getElementById('confirmBtn').disabled = false;
}

document.getElementById('confirmBtn').addEventListener('click', () => {
    localStorage.setItem('cm_selected_zone', selected);
    cmToast('Meetup location updated');
    setTimeout(() => { window.location.href = 'checkout.html'; }, 350);
});

renderZones();
</script>
</body>
</html>
