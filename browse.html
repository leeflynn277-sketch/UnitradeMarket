<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Deals — Campus Market</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="browse-view">
<div class="shell-page">
<div class="shell">
    <header class="shell-topbar">
        <button class="icon-btn" onclick="cmGoBack('index.html')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1>All Deals</h1>
        <a class="icon-btn" href="profile.html" aria-label="Profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></svg>
        </a>
    </header>

    <div class="shell-body">
        <form class="search-row" id="searchForm" style="margin-bottom:.6rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="searchInput" placeholder="Search for product">
            <button type="button" class="icon-btn" id="filterToggle" aria-label="Filters" style="width:1.6rem;height:1.6rem;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            </button>
        </form>

        <div class="toggle-row">
            <button type="button" class="toggle-pill free" data-type="free"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:.25rem;"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 01-2 2H7a2 2 0 01-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 010-5C10 3 12 8 12 8"/><path d="M16.5 8a2.5 2.5 0 000-5C14 3 12 8 12 8"/></svg>Free Items</button>
            <button type="button" class="toggle-pill trade" data-type="trade">$ Trade Items</button>
        </div>

        <div class="cat-row" id="catRow"></div>

        <div id="resultsCount" class="section-label" style="margin-top:0;"></div>
        <div id="listingList"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <p>No items match your search.<br>Try a different filter.</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" data-nav-page="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
            Home
        </a>
        <a href="cart.html" data-nav-page="cart.html" style="position:relative;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.4 12h11.2L21 7H6"/></svg>
            Cart
        </a>
        <a href="alerts.html" data-nav-page="alerts.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22a2.5 2.5 0 002.45-2h-4.9A2.5 2.5 0 0012 22zm6-6V11a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2z"/></svg>
            Alerts
        </a>
        <a href="profile.html" data-nav-page="profile.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></svg>
            Profile
        </a>
    </nav>
</div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
const state = {
    q: cmParam('q') || '',
    type: cmParam('type') || '',
    category: cmParam('category') || '',
    mine: cmParam('mine') === '1',
    saved: cmParam('saved') === '1',
};

if ((state.mine || state.saved) && !cmGetUser()) {
    window.location.href = 'login.html?returnTo=browse.html';
}

document.getElementById('searchInput').value = state.q;

const catRow = document.getElementById('catRow');
const categories = [{ key: '', label: 'All' }, ...CM_CATEGORIES];
catRow.innerHTML = categories.map((c) => {
    const style = c.bgImage ? `style="background-image: linear-gradient(rgba(15,23,42,.24), rgba(15,23,42,.58)), url('${c.bgImage}');"` : '';
    return `
        <button type="button" class="cat-pill${c.bgImage ? ' has-bg' : ''}" data-cat="${c.key}" ${style}>
            ${c.label}
        </button>
    `;
}).join('');

function applyButtonStates() {
    document.querySelectorAll('.toggle-pill').forEach((btn) => {
        btn.classList.toggle('is-active', state.type === btn.dataset.type);
    });
    document.querySelectorAll('.cat-pill').forEach((btn) => {
        btn.classList.toggle('is-active', state.category === btn.dataset.cat);
    });
}

function headerLabel() {
    if (state.mine) return 'My Listings';
    if (state.saved) return 'Saved Items';
    return 'All Deals';
}
document.querySelector('.shell-topbar h1').textContent = headerLabel();

let renderToken = 0;
async function render() {
    const myToken = ++renderToken;
    const list = document.getElementById('listingList');
    const empty = document.getElementById('emptyState');

    let items;
    try {
        const { products } = await Api.listProducts({
            q: state.q || undefined,
            type: state.type || undefined,
            category: state.category || undefined,
            mine: state.mine ? '1' : undefined,
            saved: state.saved ? '1' : undefined,
        });
        items = products;
    } catch (err) {
        if (myToken !== renderToken) return;
        cmHandleApiError(err, 'Could not load listings.');
        items = [];
    }
    if (myToken !== renderToken) return; // a newer render started while we were waiting

    document.getElementById('resultsCount').textContent = items.length + (items.length === 1 ? ' result' : ' results');

    if (items.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        if (state.mine) empty.querySelector('p').innerHTML = 'You have not listed anything for sale or giveaway yet.<br><a href="sell.html">Create your first listing</a>';
        else if (state.saved) empty.querySelector('p').innerHTML = 'No saved items yet.<br>Tap the heart on a listing to save it.';
        else empty.querySelector('p').innerHTML = 'No items match your search.<br>Try a different filter.';
        return;
    }
    empty.style.display = 'none';

    list.innerHTML = items.map((p) => `
        <div class="listing-row">
            <div class="thumb"><img src="${Api.resolveAssetUrl(p.image)}" alt="${p.title}" loading="lazy"></div>
            <div class="info">
                ${p.price > 0 ? `<span class="tag-price">${cmFormatPrice(p.price)}</span>${p.discountPercent ? `<span class="tag-discount">-${p.discountPercent}%</span>` : ''}` : '<span class="tag-free">FREE</span>'}
                ${p.status !== 'active' ? `<span class="tag-price" style="background:var(--border);color:var(--muted);">${p.status === 'sold' ? 'SOLD' : 'CLAIMED'}</span>` : ''}
                <a class="title" href="product.html?id=${p.id}">${p.title}</a>
                <div class="sub">${p.sub}</div>
                <div class="meta">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 00-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>
                    ${p.location} &middot; ${p.postedAt}
                </div>
            </div>
            <a href="product.html?id=${p.id}" class="btn ${p.price > 0 ? 'btn-outline' : 'btn-green'} btn-sm btn-pill">${p.price > 0 ? 'View' : 'Claim'}</a>
        </div>
    `).join('');
}

document.querySelectorAll('.toggle-pill').forEach((btn) => {
    btn.addEventListener('click', () => {
        state.type = state.type === btn.dataset.type ? '' : btn.dataset.type;
        applyButtonStates();
        render();
    });
});

document.querySelectorAll('.cat-pill').forEach((btn) => {
    btn.addEventListener('click', () => {
        state.category = state.category === btn.dataset.cat ? '' : btn.dataset.cat;
        applyButtonStates();
        render();
    });
});

document.getElementById('searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    state.q = document.getElementById('searchInput').value;
    render();
});
let searchDebounce;
document.getElementById('searchInput').addEventListener('input', (e) => {
    state.q = e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(render, 250);
});
document.getElementById('filterToggle').addEventListener('click', () => {
    document.getElementById('catRow').scrollIntoView({ behavior: 'smooth' });
});

applyButtonStates();
render();
</script>
</body>
</html>
