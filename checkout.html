<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Campus Market</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="cart-view">
<div class="shell-page">
<div class="shell">
    <header class="shell-topbar">
        <button class="icon-btn" onclick="cmGoBack('cart.html')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1>Checkout</h1>
        <span style="width:2.25rem;"></span>
    </header>

    <div class="shell-body" id="checkoutBody">
        <div class="empty-state"><p>Loading your cart…</p></div>
    </div>
</div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
const TIME_SLOTS = [
    'Today, morning', 'Today, afternoon', 'Today, evening',
    'Tomorrow, morning', 'Tomorrow, afternoon', 'Tomorrow, evening',
];

let cartLines = [];
let cartSubtotal = 0;
let selectedZoneId = localStorage.getItem('cm_selected_zone') || CM_SAFE_ZONES[0].id;
let selectedTime = TIME_SLOTS[0];

function selectedZone() {
    return CM_SAFE_ZONES.find((z) => z.id === selectedZoneId) || CM_SAFE_ZONES[0];
}

function renderTimeOptions() {
    return TIME_SLOTS.map((slot) => `
        <div class="zone-row ${slot === selectedTime ? 'is-selected' : ''}" data-time="${slot}">
            <span class="zicon"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
            <div class="info"><strong>${slot}</strong></div>
        </div>
    `).join('');
}

function render() {
    const body = document.getElementById('checkoutBody');

    if (!cartLines.length) {
        body.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.4 12h11.2L21 7H6"/></svg>
                <p>Your cart is empty.</p>
                <a href="browse.html" class="btn btn-indigo btn-pill" style="margin-top:.6rem;">Browse listings</a>
            </div>`;
        return;
    }

    const zone = selectedZone();

    body.innerHTML = `
        <div class="section-label" style="margin-top:0;">Order summary</div>
        <div class="info-card">
            ${cartLines.map((l) => `
                <div class="order-row">
                    <div class="thumb"><img src="${Api.resolveAssetUrl(l.product.image)}" alt="${l.product.title}"></div>
                    <div class="info">
                        <strong>${l.product.title}</strong>
                        <span>${l.size ? 'Size ' + l.size + ' · ' : ''}Qty ${l.qty}</span>
                    </div>
                    <div class="price">${l.product.price > 0 ? 'GH₵' + l.lineTotal.toFixed(2) : 'FREE'}</div>
                </div>
            `).join('')}
        </div>

        <div class="section-label">Meetup location</div>
        <div class="info-card meetup-only-card">
            <div class="zone-row is-selected" style="margin-bottom:0; cursor:default;">
                <span class="zicon"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.5 7-12a7 7 0 10-14 0c0 4.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
                <div class="info">
                    <strong>${zone.name}</strong>
                    <span>${zone.sub}</span>
                </div>
            </div>
            <a href="safe-zones.html" class="btn btn-outline btn-sm btn-block" style="margin-top:.7rem;">Change location</a>
        </div>

        <div class="section-label">Meetup time</div>
        <div id="timeList">${renderTimeOptions()}</div>

        <div class="info-card">
            <div class="totals-row grand"><span>Subtotal</span><span>${cartSubtotal > 0 ? 'GH₵' + cartSubtotal.toFixed(2) : 'FREE'}</span></div>
        </div>

        <p class="checkout-note">No online payment is involved. Meet your seller in person at the safe zone above to pay (cash) or collect your free item, and inspect it before you go.</p>

        <button type="button" class="btn btn-green btn-block" id="placeOrderBtn" style="margin-top:.4rem;">Place order</button>
    `;

    document.querySelectorAll('#timeList [data-time]').forEach((row) => {
        row.addEventListener('click', () => {
            selectedTime = row.dataset.time;
            document.querySelectorAll('#timeList .zone-row').forEach((r) => r.classList.toggle('is-selected', r.dataset.time === selectedTime));
        });
    });

    document.getElementById('placeOrderBtn').addEventListener('click', async (e) => {
        const btn = e.target;
        btn.disabled = true;
        btn.textContent = 'Placing order…';
        try {
            const { order } = await Api.createOrder({
                zone: { name: zone.name, sub: zone.sub, icon: zone.icon },
                meetupTime: selectedTime,
            });
            await cmRenderCartBadges();
            window.location.href = `order-confirmation.html?id=${order.id}`;
        } catch (err) {
            cmHandleApiError(err, 'Could not place your order.');
            btn.disabled = false;
            btn.textContent = 'Place order';
        }
    });
}

async function init() {
    if (!cmRequireLogin()) return;
    try {
        const data = await Api.getCart();
        cartLines = data.lines;
        cartSubtotal = data.subtotal;
    } catch (err) {
        cmHandleApiError(err, 'Could not load your cart.');
        cartLines = [];
        cartSubtotal = 0;
    }
    render();
}

init();
</script>
</body>
</html>
