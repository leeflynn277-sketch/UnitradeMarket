<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart — Campus Market</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="cart-view">
<div class="shell-page">
<div class="shell">
    <header class="shell-topbar">
        <button class="icon-btn" onclick="cmGoBack('browse.html')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1>My Cart</h1>
        <span style="width:2.25rem;"></span>
    </header>

    <div class="shell-body" id="cartBody"></div>

    <nav class="bottom-nav">
        <a href="index.html" data-nav-page="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
            Home
        </a>
        <a href="cart.html" data-nav-page="cart.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.4 12h11.2L21 7H6"/></svg>
            Cart
        </a>
        <a href="alerts.html" data-nav-page="alerts.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22a2.5 2.5 0 002.45-2h-4.9A2.5 2.5 0 0012 22zm6-6V11a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2z"/></svg>
            Alerts
        </a>
        <a href="profile.html" data-nav-page="profile.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></svg>
            Profile
        </a>
    </nav>
</div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
if (!cmRequireLogin()) {
    // redirecting to login
}

async function render() {
    const body = document.getElementById('cartBody');
    let lines = [];
    let subtotal = 0;
    try {
        const data = await Api.getCart();
        lines = data.lines;
        subtotal = data.subtotal;
    } catch (err) {
        cmHandleApiError(err, 'Could not load your cart.');
    }

    if (lines.length === 0) {
        body.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.4 12h11.2L21 7H6"/></svg>
                <p>Your cart is empty.</p>
                <a href="browse.html" class="btn btn-indigo btn-pill" style="margin-top:.6rem;">Browse listings</a>
            </div>`;
        return;
    }

    body.innerHTML = `
        <div class="info-card">
            ${lines.map((l) => `
                <div class="order-row">
                    <div class="thumb"><img src="${Api.resolveAssetUrl(l.product.image)}" alt="${l.product.title}"></div>
                    <div class="info">
                        <strong>${l.product.title}</strong>
                        <span>${l.size ? 'Size ' + l.size + ' · ' : ''}${cmFormatPrice(l.product.price)}</span>
                    </div>
                    ${l.product.price > 0 ? `
                    <div class="qty-stepper" style="height:2.1rem;">
                        <button type="button" data-minus="${l.itemId}" data-qty="${l.qty}" style="height:2.1rem;width:1.9rem;">–</button>
                        <span>${l.qty}</span>
                        <button type="button" data-plus="${l.itemId}" data-qty="${l.qty}" style="height:2.1rem;width:1.9rem;">+</button>
                    </div>` : `<span class="tag-free">FREE</span>`}
                    <button class="icon-btn" data-remove="${l.itemId}" aria-label="Remove" style="margin-left:.3rem;">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                    </button>
                </div>
            `).join('')}
        </div>

        <div class="info-card">
            <div class="totals-row grand"><span>Subtotal</span><span>GH₵${subtotal.toFixed(2)}</span></div>
        </div>

        <a href="checkout.html" class="btn btn-indigo btn-block">Proceed to Checkout →</a>
    `;

    body.querySelectorAll('[data-minus]').forEach((btn) => btn.addEventListener('click', async () => {
        const newQty = Number(btn.dataset.qty) - 1;
        if (newQty < 1) return;
        try { await Api.updateCartItem(btn.dataset.minus, newQty); } catch (err) { cmHandleApiError(err); }
        await cmRenderCartBadges();
        render();
    }));
    body.querySelectorAll('[data-plus]').forEach((btn) => btn.addEventListener('click', async () => {
        const newQty = Number(btn.dataset.qty) + 1;
        try { await Api.updateCartItem(btn.dataset.plus, newQty); } catch (err) { cmHandleApiError(err); }
        await cmRenderCartBadges();
        render();
    }));
    body.querySelectorAll('[data-remove]').forEach((btn) => btn.addEventListener('click', async () => {
        try { await Api.removeCartItem(btn.dataset.remove); } catch (err) { cmHandleApiError(err); }
        await cmRenderCartBadges();
        render();
    }));
}

if (cmGetUser()) render();
</script>
</body>
</html>
